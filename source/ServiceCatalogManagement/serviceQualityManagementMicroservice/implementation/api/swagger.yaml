definitions:
  ServiceLevelObjective:
    type: object
    description: Service level objectives are defined in terms of parameters and metrics, thresholds, and tolerances associated with the parameters.
    properties:
      id:
        type: string
        description: The identifier of a service level objectives.
      href:
        type: string
        description: The hyperlink to access a service level objective.
      conformanceComparator:
        type: string
        description: An operator that specifies whether a Service Level Objective is violated above or below the conformanceTarget.
      conformanceTarget:
        type: string
        description: A value used to determine if Service Level Objective is met.
      graceTimes:
        type: string
        description: The number of times an objective can remain un-updated without a violation.
      name:
        type: string
        description: The name of the service level objectives.
      thresholdTarget:
        type: string
        description: A value that used to specify when a warning should be used.
      toleranceTarget:
        type: string
        description: A value that specifies the allowable variation of a conformance Target.
      conformancePeriod:
        $ref: "#/definitions/TimePeriod"
        description: An interval of time during which the Conformance Target must be measured.
      serviceLevelObjectiveConsequence:
        type: array
        items:
          $ref: "#/definitions/ServiceLevelSpecConsequence"
        description: A list of consequences for this objective.
      serviceLevelObjectiveParameter:
        $ref: "#/definitions/ServiceLevelSpecParameter"
        description: A parameter for this objective
      tolerancePeriod:
        $ref: "#/definitions/TimePeriod"
        description: A value that specifies the allowable time variation of a conformance
      validFor:
        $ref: "#/definitions/TimePeriod"
        description: A valid duration of a thing.
      "@baseType":
        type: string
        description: When sub-classing, this defines the super-class
      "@schemaLocation":
        type: string
        format: uri
        description: A URI to a JSON-Schema file that defines additional attributes and relationships
      "@type":
        type: string
        description: When sub-classing, this defines the sub-class entity name
  ServiceLevelObjective_Create:
    type: object
    description: Service level objectives. Skipped properties - id,href
    required:
      - conformanceComparator
      - conformanceTarget
      - serviceLevelObjectiveParameter
    properties:
      conformanceComparator:
        type: string
      conformanceTarget:
        type: string
      graceTimes:
        type: string
      name:
        type: string
      thresholdTarget:
        type: string
      toleranceTarget:
        type: string
      conformancePeriod:
        $ref: "#/definitions/TimePeriod"
      serviceLevelObjectiveConsequence:
        type: array
        items:
          $ref: "#/definitions/ServiceLevelSpecConsequence"
      serviceLevelObjectiveParameter:
        $ref: "#/definitions/ServiceLevelSpecParameter"
      tolerancePeriod:
        $ref: "#/definitions/TimePeriod"
      validFor:
        $ref: "#/definitions/TimePeriod"
      "@baseType":
        type: string
      "@schemaLocation":
        type: string
        format: uri
      "@type":
        type: string
  ServiceLevelObjective_Update:
    type: object
    description: Service level objectives. Skipped properties - id,href,validFor
    properties:
      conformanceComparator:
        type: string
      conformanceTarget:
        type: string
      graceTimes:
        type: string
      name:
        type: string
      thresholdTarget:
        type: string
      toleranceTarget:
        type: string
      conformancePeriod:
        $ref: "#/definitions/TimePeriod"
      serviceLevelObjectiveConsequence:
        type: array
        items:
          $ref: "#/definitions/ServiceLevelSpecConsequence"
      serviceLevelObjectiveParameter:
        $ref: "#/definitions/ServiceLevelSpecParameter"
      tolerancePeriod:
        $ref: "#/definitions/TimePeriod"
      "@baseType":
        type: string
      "@schemaLocation":
        type: string
        format: uri
      "@type":
        type: string
  ServiceLevelObjectiveRef:
    type: object
    description: A reference to a service level objective.
    required:
      - id
    properties:
      id:
        type: string
        description: The identifier of a service level object.
      href:
        type: string
        description: The hyperlink to access a service level object.
      "@baseType":
        type: string
      "@schemaLocation":
        type: string
        format: uri
      "@type":
        type: string
      "@referredType":
        type: string
  ServiceLevelSpecConsequence:
    type: object
    description: Some consequences for the provider of the Service are resulted when the service level objective does not meet.
    properties:
      prescribedAction:
        type: string
        description: Recommended remedy for a violated Service Level Objective.
      validFor:
        $ref: "#/definitions/TimePeriod"
      "@baseType":
        type: string
      "@schemaLocation":
        type: string
        format: uri
      "@type":
        type: string
  ServiceLevelSpecParameter:
    type: object
    description: Service Level Specification parameters can be one of two types.
