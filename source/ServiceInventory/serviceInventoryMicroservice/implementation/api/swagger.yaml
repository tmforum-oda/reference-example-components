      '@type':
        type: string
        description: When sub-classing, this defines the sub-class Extensible name
  Service_Update:
    type: object
    description: "Service is a base class for defining the Service hierarchy.\nSkipped
      properties: id,href,serviceDate"
    properties:
      category:
        type: string
        description: Is it a customer facing or resource facing service
      description:
        type: string
        description: Free-text description of the service
      endDate:
