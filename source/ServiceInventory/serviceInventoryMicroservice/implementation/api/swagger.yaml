swagger: "2.0"
info:
  title: Service Inventory Management
  description: "## TMF API Reference : TMF 638 - Service Inventory Management\n\n
    Version 4.0 \n\nThe intent of this API is to provide a consistent/standardized
    mechanism to query and manipulate the Service inventory."
  version: 4.0.0
host: serverRoot
basePath: /tmf-api/serviceInventory/v4
schemes:
- https
consumes:
- application/json;charset=utf-8
produces:
- application/json;charset=utf-8
tags:
- name: service
- name: notification listeners (client side)
- name: events subscription
