definitions:
  Any: {}
  Characteristic:
    type: object
    description: Describes a given characteristic of an object or entity through a
      name/value pair.
    required:
    - name
    - value
    properties:
      id:
        type: string
        description: Unique identifier of the characteristic
      name:
        type: string
        description: Name of the characteristic
      valueType:
        type: string
        description: Data type of the value of the characteristic
      value:
        $ref: '#/definitions/Any'
        description: The value of the characteristic
      '@baseType':
        type: string
        description: When sub-classing, this defines the super-class
      '@schemaLocation':
        type: string
        format: uri
        description: A URI to a JSON-Schema file that defines additional attributes
          and relationships
      '@type':
        type: string
        description: When sub-classing, this defines the sub-class Extensible name
  Note:
    type: object
    description: Extra information about a given entity
    required:
    - date
    - author
    - text
    properties:
      id:
        type: string
        description: Identifier of the note within its containing entity
      author:
        type: string
        description: Author of the note
      date:
        type: string
        format: date-time
        description: Date of the note
      text:
        type: string
        description: Text of the note
  RelatedParty:
    type: object
    description: Related Entity reference. A related party defines party or party
      role linked to a specific entity.
    required:
    - '@referredType'
    - id
    properties:
      id:
        type: string
        description: unique identifier
      href:
        type: string
        format: uri
        description: Hyperlink reference
      name:
        type: string
        description: Name of the related entity.
      role:
        type: string
        description: Role played by the related party
      '@baseType':
        type: string
        description: When sub-classing, this defines the super-class
      '@schemaLocation':
        type: string
        format: uri
        description: A URI to a JSON-Schema file that defines additional attributes
          and relationships
      '@type':
        type: string
        description: When sub-classing, this defines the sub-class Extensible name
      '@referredType':
        type: string
        description: The actual type of the target instance when needed for disambiguation.
  ServiceStateType:
    type: string
    description: Valid values for the lifecycle state of the service
    enum:
    - feasibilityChecked
    - designed
    - reserved
    - inactive
    - active
    - terminated
  ServiceSpecificationRef:
    type: object
    description: Service specification reference
    required:
    - id
    properties:
      id:
        type: string
        description: unique identifier
      href:
        type: string
        format: uri
        description: Hyperlink reference
      name:
        type: string
        description: Name of the related entity.
      version:
        type: string
        description: Service specification version
      '@baseType':
        type: string
        description: When sub-classing, this defines the super-class
      '@schemaLocation':
        type: string
        format: uri
        description: A URI to a JSON-Schema file that defines additional attributes
          and relationships
      '@type':
        type: string
        description: When sub-classing, this defines the sub-class Extensible name
      '@referredType':
        type: string
        description: The actual type of the target instance when needed for disambiguation.
  Service:
    type: object
    description: Service is a base class for defining the Service hierarchy. All Services
      are characterized as either being possibly visible and usable by a Customer or
      not. This gives rise to the two subclasses of Service - CustomerFacingService
      and ResourceFacingService.
    properties:
      id:
        type: string
        description: Unique identifier of the service
      href:
        type: string
        description: Reference of the service
      category:
        type: string
        description: Is it a customer facing or resource facing service
      description:
        type: string
        description: Free-text description of the service
      endDate:
        type: string
        format: date-time
        description: Date when the service ends
      hasStarted:
        type: boolean
        description: If TRUE, this Service has already been started
      isBundle:
        type: boolean
        description: If true, the service is a ServiceBundle
      isServiceEnabled:
        type: boolean
        description: If FALSE and hasStarted is FALSE, this particular Service has
          NOT been enabled for use
      isStateful:
        type: boolean
        description: If TRUE, this Service can be changed without affecting any other
          services
      name:
        type: string
        description: Name of the service
      serviceDate:
        type: string
        description: Date when the service was created
      serviceType:
        type: string
        description: Business type of the service
      startDate:
        type: string
        format: date-time
        description: Date when the service starts
      startMode:
        type: string
        description: Indicates how the Service is started
      note:
        type: array
        items:
          $ref: '#/definitions/Note'
        description: A list of notes made on this service
      relatedParty:
        type: array
        items:
          $ref: '#/definitions/RelatedParty'
        description: A list of related party references
      serviceCharacteristic:
        type: array
        items:
          $ref: '#/definitions/Characteristic'
        description: A list of characteristics that characterize this service
      serviceSpecification:
        $ref: '#/definitions/ServiceSpecificationRef'
        description: The specification from which this service was instantiated
      state:
