        format: date-time
        description: Date when the service ends
      hasStarted:
        type: boolean
        description: If TRUE, this Service has already been started
      isBundle:
        type: boolean
        description: If true, the service is a ServiceBundle
      isServiceEnabled:
        type: boolean
        description: If FALSE and hasStarted is FALSE, this particular Service has
