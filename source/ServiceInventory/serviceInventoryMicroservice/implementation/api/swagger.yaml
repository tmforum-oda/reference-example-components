      serviceType:
        type: string
        description: Business type of the service
      startDate:
        type: string
        format: date-time
        description: Date when the service starts
      startMode:
        type: string
        description: Indicates how the Service is started
      note:
        type: array
        items:
          $ref: '#/definitions/Note'
        description: A list of notes made on this service
      relatedParty:
