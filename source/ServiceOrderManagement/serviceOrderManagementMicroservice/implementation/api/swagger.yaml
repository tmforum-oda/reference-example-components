definitions:
  ServiceOrder:
    type: object
    properties:
      id:
        type: string
        description: ID created on repository side
      href:
        type: string
        description: Hyperlink to access the order
      cancellationDate:
        type: string
        format: date-time
      cancellationReason:
        type: string
      category:
        type: string
      completionDate:
        type: string
        format: date-time
      description:
        type: string
      expectedCompletionDate:
        type: string
        format: date-time
      externalId:
        type: string
      notificationContact:
        type: string
      orderDate:
        type: string
        format: date-time
      priority:
        type: string
      requestedCompletionDate:
        type: string
        format: date-time
      requestedStartDate:
        type: string
        format: date-time
      startDate:
        type: string
        format: date-time
      state:
        $ref: "#/definitions/ServiceOrderStateType"
      note:
        type: array
        items:
          $ref: "#/definitions/Note"
      relatedParty:
        type: array
        items:
          $ref: "#/definitions/RelatedParty"
      serviceOrderItem:
        type: array
        items:
          $ref: "#/definitions/ServiceOrderItem"
      "@baseType":
        type: string
      "@schemaLocation":
        type: string
        format: uri
      "@type":
        type: string
  ServiceOrder_Create:
    type: object
    required:
      - serviceOrderItem
    properties:
      category:
        type: string
      description:
        type: string
      externalId:
        type: string
      notificationContact:
        type: string
      priority:
        type: string
      requestedCompletionDate:
        type: string
        format: date-time
      requestedStartDate:
        type: string
        format: date-time
      note:
        type: array
        items:
          $ref: "#/definitions/Note"
      relatedParty:
        type: array
        items:
          $ref: "#/definitions/RelatedParty"
      serviceOrderItem:
        type: array
        minItems: 1
        items:
          $ref: "#/definitions/ServiceOrderItem"
      "@baseType":
        type: string
      "@schemaLocation":
        type: string
        format: uri
      "@type":
        type: string
  ServiceOrder_Update:
    type: object
    properties:
      description:
        type: string
      expectedCompletionDate:
        type: string
        format: date-time
      externalId:
        type: string
      notificationContact:
        type: string
      priority:
        type: string
      requestedCompletionDate:
        type: string
        format: date-time
      requestedStartDate:
        type: string
        format: date-time
      state:
        $ref: "#/definitions/ServiceOrderStateType"
      note:
        type: array
        items:
          $ref: "#/definitions/Note"
      relatedParty:
        type: array
        items:
          $ref: "#/definitions/RelatedParty"
      serviceOrderItem:
        type: array
        items:
          $ref: "#/definitions/ServiceOrderItem"
  ServiceOrderStateType:
    type: string
    description: Possible values for the state of the order
    enum:
      - acknowledged
      - rejected
      - pending
      - held
      - inProgress
      - cancelled
      - completed
      - failed
      - partial
      - assessingCancellation
      - pendingCancellation
  ServiceOrderItem:
    type: object
    required:
      - id
      - action
      - service
    properties:
      id:
        type: string
      quantity:
        type: integer
      action:
        $ref: "#/definitions/OrderItemActionType"
      service:
        $ref: "#/definitions/ServiceRefOrValue"
      state:
        $ref: "#/definitions/ServiceOrderItemStateType"
      "@baseType":
        type: string
      "@schemaLocation":
        type: string
        format: uri
      "@type":
        type: string
  ServiceOrderItemStateType:
    type: string
    enum:
      - acknowledged
      - rejected
      - pending
      - held
      - inProgress
      - cancelled
      - completed
      - failed
      - assessingCancellation
      - pendingCancellation
      - partial
  OrderItemActionType:
    type: string
    enum:
      - add
      - modify
      - delete
      - noChange
  CancelServiceOrder:
    type: object
    properties:
      id:
        type: string
        description: unique identifier
      href:
        type: string
        format: uri
      cancellationReason:
        type: string
      completionMessage:
        type: string
      effectiveCancellationDate:
        type: string
        format: date-time
      requestedCancellationDate:
        type: string
        format: date-time
      state:
        $ref: "#/definitions/TaskStateType"
      serviceOrder:
        $ref: "#/definitions/ServiceOrderRef"
      "@baseType":
        type: string
      "@schemaLocation":
        type: string
        format: uri
      "@type":
        type: string
  CancelServiceOrder_Create:
    type: object
    required:
      - serviceOrder
    properties:
      cancellationReason:
        type: string
      requestedCancellationDate:
        type: string
        format: date-time
      serviceOrder:
        $ref: "#/definitions/ServiceOrderRef"
      "@baseType":
        type: string
      "@schemaLocation":
        type: string
        format: uri
      "@type":
        type: string
  TaskStateType:
    type: string
    enum:
      - accepted
      - terminatedWithError
      - inProgress
      - done
  ServiceOrderRef:
    type: object
    required:
      - id
    properties:
      id:
        type: string
      href:
        type: string
        format: uri
      name:
        type: string
      "@baseType":
        type: string
      "@schemaLocation":
        type: string
        format: uri
      "@type":
        type: string
      "@referredType":
