# Default values for servicecatalogmanagement.
component:
  id: TMFC006
  name: servicecatalogmanagement
  functionalBlock: Production
  publicationDate: 2024-11-12T00:00:00.000Z
  version: "0.0.1"
  storageClassName: default
  apipolicy:
    apiKeyVerification:
      enabled: false
      location: "header"
    rateLimit:
      enabled: false
      identifier: "IP"
      limit: "6"
      interval: "pm"
    quota:
      identifier: ""
      limit: ""
    OASValidation:
      requestEnabled: false
      responseEnabled: false
      allowUnspecifiedHeaders: false
      allowUnspecifiedQueryParams: false
      allowUnspecifiedCookies: false
    CORS:
      enabled: false
      allowCredentials: false
      allowOrigins: "https://allowed-origin.com"
      handlePreflightRequests:
        enabled: false
        allowHeaders: "Accept, Content-Type"
        allowMethods: "GET, POST"
        maxAge: 36000
    template: ""
  dependentAPIs:
    enabled: false
  MCPServer:
    enabled: true

security:
  canvasSystemRole: canvasRole

mongodb:
  port: 27017
  database: tmf

svcatapi:
  image: tmforumodacanvas/servicecatalogapi:1.0.0
  versionLabel: servicecatalogapi-1.0.0
  otlp:
    console:
      enabled: false
    protobuffCollector:
      enabled: true
      url: http://observability-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces

svcqualapi:
  image: tmforumodacanvas/servicequalityapi:1.0.0
  versionLabel: servicequalityapi-1.0.0
  otlp:
    console:
      enabled: false
    protobuffCollector:
      enabled: true
      url: http://observability-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces

processflow:
  enabled: false
  image: tmforumodacanvas/processflowapi:1.0.0
  versionLabel: processflowapi-1.0.0
  otlp:
    console:
      enabled: false
    protobuffCollector:
      enabled: true
      url: http://observability-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces

metrics:
  image: tmforumodacanvas/servicecatalogmetrics:1.0.0

mcp:
  image: tmforumodacanvas/servicecatalogmcp:1.0.0
  versionLabel: servicecatalogmcp-1.0.0

partyrole:
  image: tmforumodacanvas/partyroleapi:1.0.0
  versionLabel: partyroleapi-1.0.0

permissionspec:
  image: tmforumodacanvas/permissionspecapi:1.0.0
  versionLabel: permissionspecapi-1.0.0
  enabled: true

canvasinfo:
  host: info.canvas.svc.cluster.local
  basepath: /
roleinitialization:
  image: tmforumodacanvas/servicecatalogmanagement-roleinitialization:1.0.0
initialization:
  image: tmforumodacanvas/servicecataloginitialization:1.0.0
