{{- if .Values.processflow.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{.Release.Name}}-procflowapi
  labels:
    app: {{.Release.Name}}-{{.Values.component.name}}
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
spec:
  ports:
  - port: 8080
    targetPort: {{.Release.Name}}-pfapi
    name: http-{{.Release.Name}}-procflowapi
  type: NodePort
  selector:
    impl: {{.Release.Name}}-procflowapi
{{- end }}
