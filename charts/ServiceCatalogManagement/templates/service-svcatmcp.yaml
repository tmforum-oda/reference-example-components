{{- if .Values.component.MCPServer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{.Release.Name}}-svcatmcp
  labels:
    app: {{.Release.Name}}-{{.Values.component.name}}
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
spec:
  ports:
  - port: 8080
    targetPort: {{.Release.Name}}-scmcp
    name: http-{{.Release.Name}}-svcatmcp
  type: NodePort
  selector:
    impl: {{.Release.Name}}-svcatmcp
{{- end }}
