apiVersion: v1
kind: Service
metadata:
  name: {{.Release.Name}}-prodcatapiv4
  labels:
    app: {{.Release.Name}}-{{.Values.component.name}}
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
spec:
  ports:
  - port: 8080
    targetPort: {{.Release.Name}}-pcapi4
    name: http-{{.Release.Name}}-prodcatapiv4
  type: NodePort
  selector:
    impl: {{.Release.Name}}-prodcatapiv4
---
# Legacy alias for the v4 API under its pre-1.5.0 name. The initialization Job
# (productcataloginitialization:1.0.0) calls {{.Release.Name}}-prodcatapi. Its pod
# template is kept as it was in chart 1.4.x because Kubernetes can't change a Job's
# pod template, so a changed Job would make `helm upgrade` from 1.4.x fail.
# Use {{.Release.Name}}-prodcatapiv4 or the ExposedAPI URL for anything new.
apiVersion: v1
kind: Service
metadata:
  name: {{.Release.Name}}-prodcatapi
  labels:
    app: {{.Release.Name}}-{{.Values.component.name}}
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
spec:
  ports:
  - port: 8080
    targetPort: {{.Release.Name}}-pcapi4
    name: http-{{.Release.Name}}-prodcatapi
  type: ClusterIP
  selector:
    impl: {{.Release.Name}}-prodcatapiv4
