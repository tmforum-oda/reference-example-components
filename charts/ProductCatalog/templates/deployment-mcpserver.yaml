{{- if .Values.component.MCPServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Release.Name}}-prodcatmcp
  labels:
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
spec:
  replicas: 1
  selector:
    matchLabels:
      impl: {{.Release.Name}}-prodcatmcp
  template:
    metadata:
      labels:
        app: {{.Release.Name}}-{{.Values.component.name}}
        impl: {{.Release.Name}}-prodcatmcp
        version: {{.Values.mcp.versionLabel}}
    spec:
      containers:
      - name: {{.Release.Name}}-prodcatmcp
        image: {{.Values.mcp.image}}
        env:
        - name: RELEASE_NAME
          value: {{.Release.Name}}
        - name: COMPONENT_NAME
          value: {{.Release.Name}}-{{.Values.component.name}}        
        - name: TMF620_V4_API_URL
          value: http://{{.Release.Name}}-prodcatapiv4:8080/{{.Release.Name}}-{{.Values.component.name}}/tmf-api/productCatalogManagement/v4
        imagePullPolicy: Always
        ports:
        - name: {{.Release.Name}}-pcmcp
          containerPort: 8080
{{- end }}

