component:
  id: TMFC007
  name: serviceordermanagement
  functionalBlock: Production
  publicationDate: 2024-02-23T00:00:00.000Z
  version: "2.0.0"
  MCPServer:
    enabled: false
  dependentAPIs:
    enabled: false
  apipolicy:
    apiKeyVerification:
      enabled: false
      location: "header"
    rateLimit:
      enabled: false
      identifier: "IP"
      limit: "6"
      interval: "pm"
    quota:
      identifier: ""
      limit: ""
    OASValidation:
      requestEnabled: false
      responseEnabled: false
      allowUnspecifiedHeaders: false
      allowUnspecifiedQueryParams: false
      allowUnspecifiedCookies: false
    CORS:
      enabled: false
      allowCredentials: false
      allowOrigins: "https://allowed-origin.com"
      handlePreflightRequests:
        enabled: false
        allowHeaders: "Accept, Content-Type"
        allowMethods: "GET, POST"
        maxAge: 36000
    template: ""

security:
  canvasSystemRole: canvasRole

mongodb:
  port: 27017
  database: tmf

api:
  image: tmforumodacanvas/serviceorderapi:1.0.0
  versionLabel: serviceorderapi-1.0.0
  otlp:
    console:
      enabled: false
    protobuffCollector:
      enabled: true
      url: http://observability-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces

metrics:
  image: tmforumodacanvas/serviceordermanagementmetrics:1.0.0

partyrole:
  image: tmforumodacanvas/partyroleapi:1.0.0
  versionLabel: partyroleapi-1.0.0

permissionspec:
  image: tmforumodacanvas/permissionspecapi:1.0.0
  versionLabel: permissionspecapi-1.0.0
  enabled: true

mcp:
  image: tmforumodacanvas/serviceordermanagementmcp:1.0.0
  versionLabel: serviceordermanagementmcp-1.0.0

canvasinfo:
  host: info.canvas.svc.cluster.local
  basepath: /
roleinitialization:
  image: tmforumodacanvas/serviceordermanagement-roleinitialization:1.0.0
initialization:
  image: tmforumodacanvas/serviceordermanagementinitialization:1.0.0
