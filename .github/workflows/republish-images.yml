name: Republish Component Images (one-off)

# One-off for issue #84: publishes every image in dockerbuild-config.yaml to the
# tmforumodacanvas organization as 1.0.0. Removed again before the PR merges.

on:
  push:
    branches:
      - 84-publish-images-org-dockerhub
    paths:
      - .github/workflows/republish-images.yml

permissions:
  contents: read

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Find images that do not exist yet
        id: missing
        run: |
          missing=""
          for ref in $(python3 scripts/images.py list | awk '{print $1}'); do
            if docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
              echo "$ref already exists, skipping"
            else
              name=${ref#*/}; missing="$missing ${name%%:*}"
            fi
          done
          echo "names=$missing" >> "$GITHUB_OUTPUT"

      - name: Republish
        if: steps.missing.outputs.names != ''
        run: python3 scripts/images.py republish ${{ steps.missing.outputs.names }}

      - name: Verify
        run: |
          for ref in $(python3 scripts/images.py list | awk '{print $1}'); do
            echo "$ref: $(docker buildx imagetools inspect "$ref" --raw | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(m['platform']['architecture'] for m in d.get('manifests', []) if m['platform']['os'] != 'unknown'))")"
          done
