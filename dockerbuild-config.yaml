# Container images for the reference example components.
#
# The "Build Component Images" workflow (.github/workflows/build-images.yml) reads
# this file. Each image is built from <context>/<dockerfile>.
#
# - On a pull request, it builds (without pushing) every image whose watched
#   paths or entry changed, and fails if that image's version tag already exists
#   on Docker Hub.
# - On merge to master, it builds the same images for linux/amd64 and
#   linux/arm64 and pushes them. It never overwrites an existing tag.
#
# To publish a new image version, change the source and bump "version" here and
# in the chart that uses the image.
#
# "republishedFrom" records the personal-account image that each 1.0.0 image was
# copied from (issue #84). "scripts/images.py republish" copies those images, and
# builds and pushes the images that have no "republishedFrom" from source.

organization: tmforumodacanvas
platforms: linux/amd64,linux/arm64

images:

  # Shared by every chart (source lives in ProductCatalog)
  - name: partyroleapi
    version: 1.0.0
    context: source/ProductCatalog
    dockerfile: partyrole-dockerfile
    paths:
      - source/ProductCatalog/partyrole-dockerfile
      - source/ProductCatalog/partyRoleMicroservice
    republishedFrom: lesterthomas/partyroleapi:1.1
  - name: permissionspecapi
